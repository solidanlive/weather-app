<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Local Weather</title>

  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>

<body>
  <main class="weather-card">
    <header>
      <p class="eyebrow">CURRENT CONDITIONS</p>
      <h1>Local Weather</h1>

      <p id="status">
        Use your location to load the weather.
      </p>

      <button
        id="location-button"
        class="location-button"
        type="button"
      >
        Use My Location
      </button>
    </header>

    <section id="weather" hidden>
      <div class="current">
        <p id="condition" class="condition"></p>

        <p class="temperature">
          <span id="temperature"></span>°
        </p>

        <p>
          Feels like <span id="feels-like"></span>°F
        </p>
      </div>

      <div class="details">
        <p>
          Humidity <strong id="humidity"></strong>%
        </p>

        <p>
          Wind <strong id="wind"></strong> mph
        </p>
      </div>

      <h2>Five-day forecast</h2>

      <div id="forecast" class="forecast"></div>
    </section>

    <footer class="attribution">
      Weather data by
      <a
        href="https://open-meteo.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open-Meteo
      </a>
    </footer>
  </main>
</body>
</html>
